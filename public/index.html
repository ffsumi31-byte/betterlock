<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlockForge - photo to Roblox block model</title>
<style>
:root{--bg:#1d272d;--card:#26343c;--line:#3a4c56;--ink:#eef3f5;--mut:#93a8b3;--brick:#e0472f;--stud:#f2c230;--ok:#5fd08a}
*{box-sizing:border-box}
body{margin:0;font-family:"Bricolage Grotesque",system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:grid;grid-template-columns:300px 1fr;overflow:hidden}
aside{padding:16px;display:flex;flex-direction:column;gap:10px;overflow:auto;border-right:1px solid var(--line)}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}h1 i{font-style:normal;color:var(--stud)}
.sub{margin:4px 0 0;color:var(--mut);font-size:13px;line-height:1.45}
.box{background:var(--card);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:9px}
.t{font-size:13px;font-weight:600}
label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:6px}
label b{color:var(--ink);font-weight:600}
select{background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:8px;border-radius:6px;font:inherit}
input[type=range]{accent-color:var(--stud);width:100%}
#drop{border:1.5px dashed var(--line);border-radius:8px;padding:10px;text-align:center;cursor:pointer;color:var(--mut);font-size:13px}
#drop:hover,#drop.on{border-color:var(--stud);color:var(--ink)}
#thumbs{display:flex;gap:6px}#thumbs:empty{display:none}#thumbs img{width:44px;height:44px;object-fit:cover;border-radius:6px;border:2px solid var(--line)}#thumbs img:first-child{border-color:var(--stud)}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:11px;cursor:pointer;background:var(--brick);color:#fff}
button.g{background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:9px}
button.g:not(:disabled):hover{border-color:var(--stud)}
button:disabled{opacity:.45;cursor:not-allowed}
#go:disabled{cursor:progress}
:focus-visible{outline:3px solid var(--stud);outline-offset:2px}
.ex{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ex button{white-space:nowrap;font-size:13px;padding:8px}
main{display:grid;grid-template-rows:1fr auto;min-width:0;min-height:0}
#stage{position:relative;min-height:0}
canvas#c{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#prog{position:absolute;left:16px;right:16px;top:14px;background:rgba(29,39,45,.92);border-radius:10px;padding:12px 14px;display:none;gap:10px;grid-template-columns:auto 1fr}
#prog.on{display:grid}
#pct{font-size:34px;font-weight:800;line-height:1;min-width:86px;font-variant-numeric:tabular-nums}
#lbl{font-size:14px;font-weight:600}#bar{height:8px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
#fill{height:100%;width:0;background:var(--stud);border-radius:4px;transition:width .2s}
#steps{grid-column:1/-1;display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
#steps span.d{color:var(--ok)}#steps span.a{color:var(--ink);font-weight:600}
#info{position:absolute;left:16px;bottom:12px;font-size:12px;color:#456}
#foot{padding:12px 16px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;background:var(--card);border-top:1px solid var(--line)}
#log{font-size:13px;line-height:1.5;color:var(--mut);max-height:96px;overflow:auto}#log b{color:var(--ink)}#log .e{color:#ff8f7a}
#seen{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}#seen div{font-size:11px;color:var(--mut);text-align:center}
#seen canvas{width:100%;aspect-ratio:1;background:#dfeaf1;border-radius:6px;display:block;margin-bottom:3px}
@media(max-width:820px){body{grid-template-columns:1fr;height:auto;overflow:auto}main{height:100vh}#foot{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside>
  <div><h1>Block<i>Forge</i></h1><p class="sub">Photo in, Roblox block model out. The AI guesses the sides you can't see, then checks its own work.</p></div>
  <div class="box">
    <div class="t">1. Photo</div>
    <div id="drop" tabindex="0" role="button">Drop photos or click<br><small>First = main view. Extra angles help.</small></div>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <div id="thumbs"></div>
  </div>
  <div class="box">
    <div class="t">2. Options</div>
    <label>Type<select id="style"><option value="auto">Let the AI decide</option><option>Roblox character (R6 proportions)</option><option>Prop or item</option><option>Creature or pet</option><option>Vehicle</option><option>Building</option></select></label>
    <label>Size <b><span id="sv">24</span> studs</b><input id="size" type="range" min="10" max="48" value="24"></label>
    <label>Self-check passes <b id="pv">2</b><input id="passes" type="range" min="0" max="3" value="2"></label>
    <button id="go">Build model</button>
  </div>
  <div class="box">
    <div class="t">3. Download</div>
    <div class="ex"><button class="g" data-x="lua" disabled>Roblox Lua</button><button class="g" data-x="fbx" disabled>FBX</button><button class="g" data-x="obj" disabled>OBJ</button><button class="g" data-x="json" disabled>JSON</button></div>
  </div>
</aside>
<main>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="prog"><div id="pct">0%</div><div><div id="lbl">Starting</div><div id="bar"><div id="fill"></div></div></div><div id="steps"></div></div>
    <div id="info">Drag to rotate, scroll to zoom</div>
  </div>
  <div id="foot"><div id="log">Add a photo to start.</div><div><div id="seen"></div></div></div>
</main>
<script src="bf.js"></script>
<script>
const $=s=>document.querySelector(s);
let photos=[],model=null,busy=false,palette=[];
const log=(t,c)=>{const d=document.createElement('div');d.innerHTML=t;if(c)d.className=c;$('#log').appendChild(d);$('#log').scrollTop=1e9};
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// ---- photos ----
const drop=$('#drop'),file=$('#file');
drop.onclick=()=>file.click();drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();file.click()}};
['dragover','dragenter'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('on')}));
['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('on')}));
drop.addEventListener('drop',e=>addFiles(e.dataTransfer.files));file.onchange=()=>addFiles(file.files);
async function addFiles(fl){
  for(const f of [...fl].slice(0,4-photos.length)){
    const b=await createImageBitmap(f),k=Math.min(1,768/Math.max(b.width,b.height)),c=document.createElement('canvas');
    c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);photos.push(c.toDataURL('image/jpeg',.85));
  }
  $('#thumbs').innerHTML=photos.map(p=>`<img src="${p}" alt="reference photo">`).join('');
}
$('#size').oninput=e=>$('#sv').textContent=e.target.value;$('#passes').oninput=e=>$('#pv').textContent=e.target.value;

// ---- viewer ----
const cv=$('#c'),ctx=cv.getContext('2d');let view={az:.7,el:.35,dist:40,ctr:[0,8,0]};
function draw(){const r=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(cv.width!==w*r||cv.height!==h*r){cv.width=w*r;cv.height=h*r}
  ctx.setTransform(r,0,0,r,0,0);BF.render(ctx,w,h,model&&model.boxes,view)}
function show(m){model=m;const f=BF.frame(m.boxes);view.ctr=f.ctr;view.dist=f.dist;$('#info').textContent=`${m.boxes.length} parts · ${f.size.join(' x ')} studs · drag to rotate, scroll to zoom`;draw()}
let drag=null;cv.onpointerdown=e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)};cv.onpointerup=()=>drag=null;
cv.onpointermove=e=>{if(!drag)return;view.az-=(e.clientX-drag[0])*.008;view.el=Math.max(-.1,Math.min(1.4,view.el+(e.clientY-drag[1])*.006));drag=[e.clientX,e.clientY];draw()};
cv.onwheel=e=>{e.preventDefault();view.dist=Math.max(6,Math.min(200,view.dist*(1+e.deltaY*.001)));draw()};
addEventListener('resize',draw);
function capture(){ // the AI's eyes: 4 sides, 2x2 grid
  const S=384,c=document.createElement('canvas');c.width=c.height=S*2;const g=c.getContext('2d'),t=document.createElement('canvas');t.width=t.height=S;
  [0,Math.PI/2,Math.PI,-Math.PI/2].forEach((a,i)=>{BF.render(t.getContext('2d'),S,S,model.boxes,{...view,az:a,el:.25});g.drawImage(t,(i%2)*S,(i>>1)*S)});
  $('#seen').innerHTML='';['Front','Right','Back','Left'].forEach((n,i)=>{const w=document.createElement('div'),s=document.createElement('canvas');s.width=s.height=160;
    s.getContext('2d').drawImage(c,(i%2)*S,(i>>1)*S,S,S,0,0,160,160);w.append(s,n);$('#seen').append(w)});
  return c.toDataURL('image/jpeg',.8);
}

// ---- progress % (smooth creep inside each stage, jumps when a stage really finishes) ----
let pct=0,cap=0,timer=null,steps=[],cur=-1;
function paint(){$('#pct').textContent=Math.floor(pct)+'%';$('#fill').style.width=pct+'%';
  $('#steps').innerHTML=steps.map((s,i)=>`<span class="${i<cur?'d':i===cur?'a':''}">${i<cur?'✓ ':''}${s}</span>`).join('')}
function stage(i,from,to,label){cur=i;pct=Math.max(pct,from);cap=to;$('#lbl').textContent=label;paint()}
function startProg(n){steps=['Read photo','Pixel preview','AI builds all sides',...Array.from({length:n},(_,i)=>'Self-check '+(i+1)),'Finish'];pct=0;cap=0;$('#prog').classList.add('on');clearInterval(timer);
  timer=setInterval(()=>{if(pct<cap-.3){pct+=(cap-pct)*.035;paint()}},150)}
function endProg(ok,msg){clearInterval(timer);if(ok){cur=steps.length;pct=100;$('#lbl').textContent='Done';paint();setTimeout(()=>{if(!busy)$('#prog').classList.remove('on')},2500)}else{$('#lbl').textContent=msg;$('#fill').style.background='#e0472f'}}

// ---- AI ----
async function ai(body){
  const r=await fetch('/api/ai',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({images:photos,...body})});
  let j;try{j=await r.json()}catch{throw new Error('Server error '+r.status+' (timeout?). On Netlify use fewer passes, or deploy on Render.')}
  if(!r.ok)throw new Error(j.error||'Request failed');return j;
}
async function pixelPreview(){
  const im=await createImageBitmap(await (await fetch(photos[0])).blob()),N=+$('#size').value,k=N/Math.max(im.width,im.height);
  const c=document.createElement('canvas');c.width=Math.max(4,Math.round(im.width*k));c.height=Math.max(4,Math.round(im.height*k));
  const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(im,0,0,c.width,c.height);
  return BF.photoVoxel(g.getImageData(0,0,c.width,c.height));
}
$('#go').onclick=async()=>{
  if(busy)return;if(!photos.length){log('Add a photo first.','e');return}
  const n=+$('#passes').value;busy=true;$('#go').disabled=true;$('#log').innerHTML='';$('#fill').style.background='';
  document.querySelectorAll('[data-x]').forEach(b=>b.disabled=true);startProg(n);
  try{
    stage(0,0,8,'Reading your photo');await new Promise(r=>setTimeout(r,250));
    stage(1,8,16,'Making an instant pixel preview');
    const pv=await pixelPreview();palette=pv.palette;show(BF.clean(pv));log(`<b>Preview</b> from pixels: ${pv.boxes.length} parts (front only, the AI now builds every side).`);
    const share=(70)/(n+1);let base=16;
    stage(2,base,base+share*.95,'AI is designing all sides');
    let m=BF.clean(await ai({mode:'build',style:$('#style').value,size:+$('#size').value,palette}));show(m);base+=share;
    log(`<b>Built</b> ${esc(m.name)||'model'}: ${m.boxes.length} parts. ${esc(m.notes)}`);
    if(m.views)log(`<b>Guessed sides</b> back: ${esc(m.views.back)} · left: ${esc(m.views.left)}`);
    for(let p=1;p<=n;p++){
      stage(2+p,base,base+share*.95,`Self-check ${p}: AI looks at its own render`);
      const shot=capture(),next=BF.clean(await ai({mode:'refine',render:shot,model:{name:m.name,boxes:m.boxes}}));
      m=next;show(m);base+=share;log(`<b>Fix ${p}</b> ${esc(m.critique)||'adjusted details'} (${m.boxes.length} parts)`);
    }
    stage(3+n,96,99,'Finishing');capture();model=m;
    document.querySelectorAll('[data-x]').forEach(b=>b.disabled=false);log('<b>Done.</b> Download on the left.');endProg(true);
  }catch(e){log(esc(e.message),'e');endProg(false,'Stopped: '+e.message);
    if(model)document.querySelectorAll('[data-x]').forEach(b=>b.disabled=false)} // keep the pixel preview downloadable
  busy=false;$('#go').disabled=false;
};

// ---- downloads ----
function save(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=name;document.body.append(a);a.click();a.remove()}
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{
  if(!model)return;const t=b.dataset.x,n=(model.name||'model').replace(/\W+/g,'_');
  save(`${n}.${t}`,t==='json'?JSON.stringify(model):t==='lua'?BF.toLua(model):t==='fbx'?BF.toFBX(model):BF.toOBJ(model));
});
draw();
</script>
</body>
</html>
